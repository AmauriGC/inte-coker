<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>{{titulo}}</title></head>
<body style="margin:0;padding:24px;background:#F3F0EA;font-family:Arial,Helvetica,sans-serif;color:#1D1B18">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border-radius:20px">
    <tr><td style="padding:32px">
      <p style="margin:0 0 24px;font-size:22px;font-weight:bold">GC-Confort</p>
      <h1 style="margin:0 0 12px;font-size:20px">Hola, {{nombre}}</h1>
      <p style="margin:0 0 8px;font-size:16px;font-weight:bold">{{titulo}}</p>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#4A443C">{{texto}}</p>
      <a href="{{enlace}}" style="display:inline-block;padding:14px 28px;border-radius:26px;background:#A8461F;color:#FFFFFF;font-weight:bold;text-decoration:none">{{boton}}</a>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6B655C">
        Responde desde la conversación del pedido en GC-Confort; este correo no recibe respuestas.
      </p>
    </td></tr>
  </table>
</body>
</html>
