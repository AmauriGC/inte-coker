spring.application.name=back

# Carga el .env de la raíz del proyecto (funciona ejecutando desde back/ o desde inte-cocker/)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---------- Servidor ----------
server.port=${SERVER_PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Base de datos ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catalogo_muebles}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------- Correo ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:false}

# ---------- Admin inicial ----------
app.admin.email=${ADMIN_EMAIL:admin@catalogo.com}
app.admin.password=${ADMIN_PASSWORD:Admin123*}

# ---------- Archivos (.glb hasta 50 MB) ----------
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ---------- Actuator (healthcheck para Docker/Jenkins) ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
